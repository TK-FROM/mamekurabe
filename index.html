/* ブラウザによってはファイルの保存がそもそもできない（スマホや、公開ページとして
   開いたとき）。そこで文字にして持ち出せる経路を必ず用意しておく。
   写真は文字にすると膨大になるので、こちらには含めない。 */
/* パソコンで直接ファイルを開いているときだけ、ファイルの保存ができる。
   ウェブに公開したページの中ではブラウザが保存を止めるので、文字の控えに一本化する。 */
function canDownload(){
  try{return location.protocol==='file:'}catch(e){return false}
}
function backupSheet(){
  const light=Object.assign({},S,{photos:{}});
  const json=JSON.stringify(light);
  const body='<div class="pad">'+
    '<p class="muted" style="margin:0 0 12px">下の文字をすべてコピーして、メモ帳やメールに貼って保管してください。'+
    '別の端末では、下段に貼り付ければそのまま戻せます。</p>'+
    '<textarea id="bk-text" readonly style="min-height:130px;font-size:11.5px;line-height:1.5">'+esc(json)+'</textarea>'+
    '<button class="btn wide" style="margin-top:10px" data-act="copytext">この文字をコピーする</button>'+
    '<div class="note" style="margin-top:12px">豆の登録・感想・抽出の記録・設定がすべて入っています（'+
    Math.round(json.length/1024)+'KB）。<b>写真だけは文字にできないので入っていません。</b>'+
    '写真ごと残したいときは、パソコンで「ファイルに書き出す」を使ってください。</div>'+
    '<div class="hr" style="margin:22px 0"></div>'+
    '<label style="display:block;font-size:12.5px;font-weight:700;color:var(--sub);margin-bottom:9px;'+
    'letter-spacing:.06em">保管しておいた文字から戻す</label>'+
    '<textarea id="bk-in" placeholder="ここに貼り付けてください" style="min-height:100px;font-size:11.5px"></textarea>'+
    '<button class="btn ghost wide" style="margin-top:10px" data-act="pastetext">貼り付けた内容で戻す</button>'+
    '</div>';
  openSheet('記録の控え',body);
}
function copyBackup(btn){
  const el=$('#bk-text');if(!el)return;
  const done=()=>{btn.textContent='コピーしました';S.lastExport=Date.now();save();
    setTimeout(()=>{btn.textContent='この文字をコピーする'},1600)};
  const manual=()=>{
    try{el.focus();el.select();
      if(document.execCommand&&document.execCommand('copy'))return done();
    }catch(e){}
    alert('自動でコピーできませんでした。上の枠を長押しして、すべて選んでコピーしてください。');
  };
  if(navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(el.value).then(done,manual);
  else manual();
}
function pasteBackup(){
  const el=$('#bk-in');const v=el&&el.value?el.value.trim():'';
  if(!v){alert('先に、保管しておいた文字を貼り付けてください。');return}
  let d;
  try{d=JSON.parse(v)}
  catch(e){alert('読み取れませんでした。文字が途中で切れていないか確かめてください。');return}
  if(!d||typeof d!=='object'){alert('この文字は記録の控えではないようです。');return}
  if(!confirm('いまこの端末にある記録は上書きされます。よろしいですか？'))return;
  const keepPhotos=S.photos||{};
  S=migrate(d);
  /* 控えに写真は入っていないので、いま端末にある写真はそのまま残す */
  Object.keys(keepPhotos).forEach(k=>{if(!S.photos[k])S.photos[k]=keepPhotos[k]});
  save();closeSheet();renderAll();alert('記録を戻しました。');
}
function exportJSON(){
  try{
    const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='まめ比べ_backup_'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    S.lastExport=Date.now();save();renderMy();
  }catch(err){alert('書き出しに失敗しました：'+err.message)}
}
document.addEventListener('change',e=>{
  if(e.target.id==='photofile'){

/* ===== ビュー切替 ===== */
/* =========================================================================
   左端から右へなぞって、ひとつ前に戻る

   iPhoneの標準の動きに合わせている。戻り先は上から順に
   1. シートが開いていれば、シートを閉じる
   2. 詳細の全画面が開いていれば、それを閉じる
   3. お店を1つに絞っているときは、お店の一覧に戻る
   の順で、いちばん手前のものから閉じる。

   始点を左端の30px以内に限っているのは、絞り込みのチップの行や味の地図が
   横スクロールするためで、画面のどこでも反応させると、それらが動かせなくなる。
   指の動きに合わせて画面が付いてくるようにしてあるのは、
   途中でやめられることを見せるため。半分も引かずに離せば元に戻る。
   ========================================================================= */
/* iPhoneのSafariにも「画面の端から戻る」操作があり、こちらの指定では止められない。
   何もしないと、その操作でアプリごと閉じて（前に見ていたページへ移動して）しまう。
   そこで画面を開くたびに履歴を1つ積んでおき、戻る操作が来たら
   積んだぶんを1つ消して、その画面を閉じるだけにしている。
   履歴を使えない環境（埋め込み表示など）でも落ちないよう、try で囲ってある。 */
function pushLayer(){try{history.pushState({mk:Date.now()},'')}catch(e){}}
window.addEventListener('popstate',()=>{
  const tg=backTarget();
  if(tg){tg.act();pushLayer()}
});
function backTarget(){
  if($('#sheet').classList.contains('on'))
    return {el:$('#sheet'),move:$('#sheet').querySelector('.panel'),act:closeSheet};
  if($('#full').classList.contains('on'))
    return {el:$('#full'),move:$('#full'),act:closeFull};
  if(document.body.dataset.view==='search'&&S.filter.shop.length)
    return {el:null,move:null,act:()=>{S.filter.shop=[];save();renderList();window.scrollTo(0,0)}};
  return null;
}
(function(){
  const EDGE=30;      /* この幅より内側から始めたスワイプは相手にしない */
  const NEED=70;      /* これだけ引いたら戻る。これ未満なら元に戻す */
  let t=null,sx=0,sy=0,dx=0,axis='';
  const setX=(el,v)=>{if(el){el.style.transition='none';el.style.transform=v?'translateX('+v+'px)':''}};
  const release=(el,ok)=>{
    if(!el)return;
    el.style.transition='transform .22s cubic-bezier(.22,.9,.3,1)';
    el.style.transform=ok?'translateX(100%)':'';
    if(!ok)setTimeout(()=>{if(el)el.style.transition=el.style.transform=''},240);
  };
  document.addEventListener('touchstart',e=>{
    t=null;axis='';dx=0;
    if(e.touches.length!==1)return;
    const p=e.touches[0];
    if(p.clientX>EDGE)return;
    const tg=backTarget();
    if(!tg)return;
    t=tg;sx=p.clientX;sy=p.clientY;
  },{passive:true});
  document.addEventListener('touchmove',e=>{
    if(!t||e.touches.length!==1)return;
    const p=e.touches[0], ddx=p.clientX-sx, ddy=p.clientY-sy;
    /* 最初のひと動きで、横になぞったのか縦に読もうとしたのかを決める。
       いったん決めたら途中で変えない。指が斜めに動いても画面が揺れないようにするため。 */
    if(!axis){
      if(Math.abs(ddx)<6&&Math.abs(ddy)<6)return;
      axis=Math.abs(ddx)>Math.abs(ddy)*1.3?'x':'y';
      if(axis==='y'){t=null;return}
    }
    dx=Math.max(0,ddx);
    if(t.move)setX(t.move,dx);
    if(e.cancelable)e.preventDefault();
  },{passive:false});
  document.addEventListener('touchend',()=>{
    if(!t)return;
    const go=dx>=NEED, tg=t;
    t=null;
    if(!go){release(tg.move,false);return}
    if(tg.move){
      release(tg.move,true);
      setTimeout(()=>{tg.move.style.transition=tg.move.style.transform='';tg.act()},200);
    }else tg.act();
  },{passive:true});
  document.addEventListener('touchcancel',()=>{if(t){release(t.move,false);t=null}},{passive:true});
})();
function setView(v){
  document.body.dataset.view=v;
  document.querySelectorAll('.tabbar button').forEach(b=>b.setAttribute('aria-selected',b.dataset.go===v));

  if(v==='map')renderMap();if(v==='esp')renderEsp();if(v==='my')renderMy();
  window.scrollTo(0,0);
}
