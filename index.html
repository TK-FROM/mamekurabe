<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>まめ比べ</title>
<style>
/* ラテとカフェの色。真っ黒・純白を使わず、すべて暖色に寄せている。
   系列色（s1〜s3）は比較画面で3件を見分けるためのもので、
   色相を赤茶・青緑・金と大きく離し、背景とのコントラストも3:1以上を確保している。 */
:root{
  --bg:#fdfaf6; --bg2:#f9f1e9; --card:#ffffff; --text:#332722;
  --sub:#6f5e54; --mute:#8a7365;
  --line:#efe4d9; --track:#f2e9e1; --chip:#f7efe8; --chipOn:#9d5c4d; --chipOnText:#fffaf6;
  --accent:#b5705f; --accent-soft:#f9e9e3; --gold:#c9a227;
  --s1:#b5705f; --s2:#5b8a8c; --s3:#ad7c14;
  --warn:#b4762a; --ok:#4f8a6b; --bad:#c05c50;
  --roast-l:#e6cda4; --roast-m:#bd8a5e; --roast-d:#7a5138;
  --shadow:0 1px 2px rgba(94,62,44,.05), 0 6px 20px rgba(94,62,44,.07);
  --shadow-lift:0 2px 6px rgba(94,62,44,.09), 0 14px 34px rgba(94,62,44,.11);
  --serif:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP",serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1d1714; --bg2:#241c17; --card:#282019; --text:#f7f0e8;
    --sub:#c9b8aa; --mute:#9c8a7d;
    --line:#3a3029; --track:#3a3029; --chip:#332a23; --chipOn:#e6bcae; --chipOnText:#2a1f1a;
    --accent:#dd9c86; --accent-soft:#3a2a24; --gold:#d9b155;
    --s1:#dd9c86; --s2:#7fb3b5; --s3:#d9b155;
    --warn:#e0a95e; --ok:#7fb99b; --bad:#e58b7e;
    --roast-l:#d6b98e; --roast-m:#b1815a; --roast-d:#8a6248;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.34);
    --shadow-lift:0 2px 6px rgba(0,0,0,.4), 0 14px 34px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg:#1d1714; --bg2:#241c17; --card:#282019; --text:#f7f0e8;
  --sub:#c9b8aa; --mute:#9c8a7d;
  --line:#3a3029; --track:#3a3029; --chip:#332a23; --chipOn:#e6bcae; --chipOnText:#2a1f1a;
  --accent:#dd9c86; --accent-soft:#3a2a24; --gold:#d9b155;
  --s1:#dd9c86; --s2:#7fb3b5; --s3:#d9b155;
  --warn:#e0a95e; --ok:#7fb99b; --bad:#e58b7e;
  --roast-l:#d6b98e; --roast-m:#b1815a; --roast-d:#8a6248;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.34);
  --shadow-lift:0 2px 6px rgba(0,0,0,.4), 0 14px 34px rgba(0,0,0,.45);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Noto Sans JP",sans-serif;
  background:var(--bg); color:var(--text); font-size:16px; line-height:1.75;
  letter-spacing:.01em; touch-action:manipulation; -webkit-text-size-adjust:100%;
  padding-bottom:calc(74px + env(safe-area-inset-bottom));
  background-image:radial-gradient(120% 60% at 50% 0%, var(--bg2) 0%, transparent 62%);
  background-attachment:fixed;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;touch-action:manipulation;
  transition:transform .12s ease, background .18s ease, color .18s ease, box-shadow .18s ease}
button:active{transform:scale(.97)}
input,select,textarea{font:inherit;font-size:16px;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.4}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
svg{display:block}

/* ===== ヘッダー / タブ ===== */
.appbar{position:sticky;top:0;z-index:30;
  background:color-mix(in srgb, var(--bg) 86%, transparent);
  -webkit-backdrop-filter:saturate(1.6) blur(14px); backdrop-filter:saturate(1.6) blur(14px);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:6px;padding:10px 14px;min-height:58px}
.appbar h1{font-family:var(--serif);font-size:21px;font-weight:600;letter-spacing:.09em;flex:1}
.appbar .ico{width:44px;height:44px;display:grid;place-items:center;border-radius:14px;color:var(--sub)}
.appbar .ico svg{width:21px;height:21px}
.appbar .ico:active{background:var(--chip);color:var(--accent)}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;
  background:color-mix(in srgb, var(--card) 92%, transparent);
  -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);
  box-shadow:0 -6px 24px rgba(94,62,44,.06)}
.tabbar button{flex:1;height:66px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:5px;font-size:10.5px;color:var(--mute);font-weight:700;letter-spacing:.04em;position:relative}
.tabbar button svg{width:23px;height:23px;stroke-width:1.6}
.tabbar button[aria-selected="true"]{color:var(--accent)}
.tabbar button[aria-selected="true"] svg{stroke-width:2}
.tabbar button[aria-selected="true"]::before{content:"";position:absolute;top:0;width:26px;height:3px;
  border-radius:0 0 3px 3px;background:var(--accent)}
main>section{display:none;padding:0 0 28px}
body[data-view="search"] #v-search,body[data-view="map"] #v-map,
body[data-view="esp"] #v-esp,body[data-view="my"] #v-my{display:block}

/* ===== 共通パーツ ===== */
.pad{padding:14px 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin:0 16px 14px;
  box-shadow:var(--shadow)}
.muted{color:var(--sub);font-size:13.5px}
.tiny{color:var(--mute);font-size:12px;line-height:1.7}
.row{display:flex;align-items:center;gap:8px}
.between{display:flex;align-items:center;justify-content:space-between;gap:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chiprow{display:flex;gap:8px;overflow-x:auto;padding:8px 16px;scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}
.chip{background:var(--chip);border:1px solid transparent;border-radius:999px;padding:9px 16px;
  font-size:13.5px;font-weight:700;white-space:nowrap;min-height:42px;display:inline-flex;align-items:center;
  color:var(--sub);letter-spacing:.02em}
.chip[aria-pressed="true"]{background:var(--chipOn);color:var(--chipOnText);
  box-shadow:0 3px 12px color-mix(in srgb, var(--accent) 34%, transparent)}
.chip:disabled{opacity:.32}
.btn{background:var(--chipOn);color:var(--chipOnText);border-radius:16px;padding:15px 20px;
  font-weight:700;font-size:15px;min-height:52px;display:inline-flex;align-items:center;justify-content:center;gap:7px;
  letter-spacing:.03em;box-shadow:0 4px 16px color-mix(in srgb, var(--accent) 26%, transparent)}
.btn.ghost{background:var(--chip);color:var(--text);box-shadow:none}
.btn.wide{width:100%}
.btn:disabled{opacity:.4;box-shadow:none}
.searchbar{padding:2px 16px 10px}
.searchbar input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:13px 16px;min-height:50px;box-shadow:var(--shadow)}
.searchbar input::placeholder{color:var(--mute)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;letter-spacing:.05em;
  padding:4px 11px;border-radius:999px;background:var(--chip);color:var(--sub)}
.badge.r-light{background:var(--roast-l);color:#573a17}
.badge.r-mid{background:var(--roast-m);color:#fff6ee}
.badge.r-dark{background:var(--roast-d);color:#f5e6da}

/* ===== 味バー ===== */
.tbar{display:grid;grid-template-columns:50px 1fr 56px;align-items:center;gap:10px;min-height:28px}
.tbar .lb{font-size:12.5px;color:var(--sub);font-weight:700;letter-spacing:.05em}
.tbar .wd{font-size:11.5px;color:var(--mute);text-align:right;font-weight:600}
.track{display:block;height:9px;border-radius:5px;background:var(--track);overflow:hidden}
.fill{height:9px;border-radius:5px;background:var(--s1);display:block;position:relative;
  transition:width .4s cubic-bezier(.22,.9,.3,1)}
.fill::after{content:"";position:absolute;inset:0;border-radius:inherit;
  background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,0) 62%)}

/* ===== 豆カード ===== */
.bean{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 16px 15px 20px;
  margin:0 16px 12px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.bean:active{box-shadow:var(--shadow-lift);transform:scale(.995)}
.bean::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--roast-m)}
.bean.r-light::before{background:linear-gradient(180deg,var(--roast-l),color-mix(in srgb,var(--roast-l) 70%,var(--roast-m)))}
.bean.r-mid::before{background:linear-gradient(180deg,var(--roast-m),color-mix(in srgb,var(--roast-m) 70%,var(--roast-d)))}
.bean.r-dark::before{background:linear-gradient(180deg,var(--roast-d),#3d281c)}
.bean h3{font-family:var(--serif);font-size:17.5px;font-weight:600;letter-spacing:.03em;line-height:1.45}
.bean .meta{font-size:12.5px;color:var(--sub);margin:5px 0 12px;letter-spacing:.02em}
.bean .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px}
.price{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.price small{font-size:10.5px;color:var(--mute);font-weight:600;letter-spacing:.03em}
.acts{display:flex;gap:8px}
.iconbtn{width:44px;height:44px;border-radius:14px;background:var(--chip);display:grid;place-items:center;
  color:var(--sub)}
.iconbtn svg{width:19px;height:19px}
.iconbtn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}

/* ===== トレイ ===== */
#tray{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom));z-index:35;
  background:var(--card);border-top:1px solid var(--line);padding:12px 16px;display:none;
  align-items:center;gap:10px;box-shadow:0 -8px 28px rgba(94,62,44,.13)}
#tray.on{display:flex}
#tray .slots{flex:1;display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}
#tray .slots::-webkit-scrollbar{display:none}
#tray .btn{padding:12px 18px;min-height:46px;font-size:14px}
.slot{background:var(--chip);border-radius:12px;padding:7px 11px;font-size:12px;font-weight:700;
  white-space:nowrap;display:flex;align-items:center;gap:7px;min-height:38px}

/* ===== シート / モーダル ===== */
.sheet{position:fixed;inset:0;z-index:60;display:none}
.sheet.on{display:block}
.sheet .veil{position:absolute;inset:0;background:rgba(48,30,22,.42);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.sheet .panel{position:absolute;left:0;right:0;bottom:0;max-height:88dvh;background:var(--bg);
  border-radius:28px 28px 0 0;display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 -12px 44px rgba(48,30,22,.26);animation:rise .3s cubic-bezier(.22,.9,.3,1)}
@keyframes rise{from{transform:translateY(22px);opacity:.4}to{transform:none;opacity:1}}
.sheet .grab{width:44px;height:4px;border-radius:2px;background:var(--line);margin:12px auto 6px}
.sheet .body{overflow-y:auto;overscroll-behavior:contain;padding:4px 0 12px;flex:1}
.sheet .foot{border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  display:flex;gap:10px;background:var(--card)}
.sheet strong{font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:.05em}
.full{position:fixed;inset:0;z-index:70;background:var(--bg);display:none;flex-direction:column}
.full.on{display:flex}
.full .top{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);
  min-height:56px;background:color-mix(in srgb, var(--bg) 88%, transparent);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.full .top .ico{width:44px;height:44px;display:grid;place-items:center;border-radius:14px;color:var(--sub)}
.full .top .ico svg{width:21px;height:21px}
.full .top h2{font-family:var(--serif);font-size:16.5px;font-weight:600;letter-spacing:.05em;flex:1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.full .body{flex:1;overflow-y:auto;padding-bottom:calc(28px + env(safe-area-inset-bottom))}

/* ===== 詳細のヒーロー ===== */
.hero{position:relative;overflow:hidden;padding:28px 20px 24px;color:#fff8f2}
.hero.r-light{background:linear-gradient(150deg,#d9b58a,#a9764a)}
.hero.r-mid{background:linear-gradient(150deg,#b9825a,#7d4f33)}
.hero.r-dark{background:linear-gradient(150deg,#7a5138,#402a1e)}
.hero::after{content:"";position:absolute;right:-46px;top:-58px;width:190px;height:190px;border-radius:50%;
  background:radial-gradient(circle at 32% 32%, rgba(255,255,255,.28), rgba(255,255,255,0) 68%)}
.hero .eyebrow{font-size:11.5px;letter-spacing:.16em;font-weight:700;opacity:.86;text-transform:uppercase}
.hero h3{font-family:var(--serif);font-size:25px;font-weight:600;letter-spacing:.04em;margin:8px 0 6px;
  position:relative;z-index:1;text-shadow:0 1px 8px rgba(60,34,20,.24)}
.hero .sub{font-size:13px;opacity:.92;position:relative;z-index:1}
.hero .tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px;position:relative;z-index:1}
.hero .tags span{background:rgba(255,255,255,.19);border:1px solid rgba(255,255,255,.28);
  border-radius:999px;padding:4px 12px;font-size:11.5px;font-weight:700;letter-spacing:.03em}
.saying{font-size:15.5px;line-height:1.95;margin:0;padding:20px 20px 6px;letter-spacing:.02em}
.phero{display:flex;gap:20px;align-items:center;padding:24px 20px}
.phero .pkg{flex:none;position:relative;z-index:1}
.hero.onlight{color:#3d2a1c}
.hero.onlight h3{text-shadow:none}
.hero.onlight .tags span{background:rgba(255,255,255,.45);border-color:rgba(255,255,255,.62)}

/* ===== 見出し ===== */
.sect{font-family:var(--serif);font-size:15px;font-weight:600;letter-spacing:.09em;
  display:flex;align-items:center;gap:10px;margin:0 0 12px}
.sect::after{content:"";flex:1;height:1px;background:var(--line)}
.sec-title{font-family:var(--serif);font-size:14px;font-weight:600;color:var(--sub);
  letter-spacing:.12em;padding:22px 18px 10px}

/* ===== 比較 ===== */
.legend{display:flex;flex-direction:column;gap:9px;padding:16px 18px;border-bottom:1px solid var(--line)}
.legend .li{display:flex;align-items:center;gap:10px;font-size:14.5px}
.key{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;color:#fff;font-size:12px;
  font-weight:800;flex:none;box-shadow:0 2px 7px rgba(94,62,44,.22)}
.cmpblock{padding:18px}
.cmpblock+.cmpblock{border-top:1px solid var(--line)}
.cmpblock h4{font-family:var(--serif);font-size:15px;font-weight:600;letter-spacing:.07em;margin:0 0 3px}
.cmprow{display:grid;grid-template-columns:26px 1fr 36px;align-items:center;gap:10px;margin-top:9px}
.win{font-size:10.5px;font-weight:800;color:var(--ok);margin-left:6px;letter-spacing:.03em}

/* ===== ステッパー ===== */
.step{display:grid;grid-template-columns:58px 1fr 58px;gap:10px;align-items:center}
.step button{background:var(--chip);border-radius:16px;height:56px;font-size:23px;font-weight:700;color:var(--accent)}
.step button:active{background:var(--chipOn);color:var(--chipOnText)}
.step .val{text-align:center;font-size:25px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.step .val small{display:block;font-size:11px;font-weight:600;color:var(--mute);letter-spacing:.08em}
.field{margin:0 0 20px}
.field>label{display:block;font-size:12.5px;font-weight:700;color:var(--sub);margin-bottom:9px;letter-spacing:.06em}
.seg{display:flex;gap:7px}
.seg button{flex:1;background:var(--chip);border-radius:15px;min-height:56px;font-size:12.5px;font-weight:700;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px;color:var(--sub)}
.seg button[aria-pressed="true"]{background:var(--chipOn);color:var(--chipOnText);
  box-shadow:0 4px 14px color-mix(in srgb, var(--accent) 30%, transparent)}
.seg button .g{font-size:18px}
.stars{display:flex;gap:5px}
.stars button{width:48px;height:48px;font-size:27px;color:var(--line)}
.stars button.on{color:var(--gold)}

/* ===== 提案 ===== */
.advice{border-radius:20px;padding:18px;margin:0 16px 14px;border:1px solid var(--line);
  background:linear-gradient(165deg, var(--accent-soft), var(--card) 68%);box-shadow:var(--shadow)}
.advice .k{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--warn)}
.advice .do{font-family:var(--serif);font-size:19px;font-weight:600;margin:9px 0 8px;letter-spacing:.03em;line-height:1.6}
.advice.ok .k{color:var(--ok)}

/* ===== 収束バー ===== */
.shotrow{display:grid;grid-template-columns:42px 1fr 40px 32px;align-items:center;gap:9px;
  padding:8px 0;border-bottom:1px solid var(--line);font-size:12px}
.shotrow:last-of-type{border-bottom:none}
.shotrow .bar{height:16px;border-radius:6px;background:var(--track);position:relative;overflow:hidden}
.shotrow .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;display:block}

/* ===== マップ ===== */
.mapwrap{padding:0 16px}
.mapwrap svg{width:100%;height:auto;display:block;background:var(--card);border:1px solid var(--line);
  border-radius:20px;box-shadow:var(--shadow)}
.dot{cursor:pointer}

/* 焙煎の深さ（横）× コクの強さ（縦）で並べる一覧。店頭のコーヒーマップと同じ読み方。 */
.cmap{display:grid;grid-template-columns:22px repeat(3,1fr);margin:0 16px;background:var(--card);
  border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
.cmap .corner{background:var(--chip);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.cmap .zh{font-size:11px;font-weight:800;letter-spacing:.06em;text-align:center;padding:9px 2px;
  border-bottom:1px solid var(--line)}
.cmap .zh+.zh{border-left:1px solid var(--line)}
.cmap .zh.z-l{background:linear-gradient(180deg,color-mix(in srgb,var(--roast-l) 46%,var(--card)),var(--card));color:#6b4a1e}
.cmap .zh.z-m{background:linear-gradient(180deg,color-mix(in srgb,var(--roast-m) 40%,var(--card)),var(--card));color:#5c3a1e}
.cmap .zh.z-d{background:linear-gradient(180deg,color-mix(in srgb,var(--roast-d) 40%,var(--card)),var(--card));color:#f2e4d8}
.cmap .yaxis{background:var(--chip);border-right:1px solid var(--line);writing-mode:vertical-rl;
  display:flex;align-items:center;justify-content:space-between;padding:14px 0;gap:8px;
  font-size:9.5px;font-weight:800;letter-spacing:.2em;color:var(--mute)}
.cmap .col{padding:10px 5px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.cmap .col+.col{border-left:1px solid var(--line)}
.mapitem{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 3px;border-radius:13px;
  text-align:center;width:100%;min-width:0}
.mapitem:active{background:var(--chip)}
.mapitem .mi{width:36px;height:auto;flex:none;filter:drop-shadow(0 3px 7px rgba(94,62,44,.22))}
.mapitem img.mi{height:48px;object-fit:cover;border-radius:6px}
.mapitem b{font-size:10.5px;font-weight:700;line-height:1.4;word-break:break-word;letter-spacing:0}
.mapitem em{font-size:9.5px;color:var(--mute);line-height:1.45;font-style:normal;word-break:break-word}
.mapitem .tag{font-size:8.5px;font-weight:800;letter-spacing:.04em;padding:2px 6px;border-radius:999px;
  background:var(--accent-soft);color:var(--accent)}
.cmap .colempty{font-size:10px;color:var(--mute);text-align:center;padding:18px 4px;line-height:1.6}
.barista{display:flex;gap:12px;align-items:flex-start;margin:14px 16px 0;padding:15px 16px;
  background:var(--accent-soft);border-radius:18px}
.barista .bico{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;flex:none;
  display:grid;place-items:center;font-size:16px}
.barista p{margin:0;font-size:12.5px;line-height:1.75;color:var(--sub)}

/* ===== その他 ===== */
.empty{text-align:center;padding:44px 28px;color:var(--sub)}
.empty .g{font-size:34px;display:block;margin-bottom:12px;opacity:.55}
details{border:1px solid var(--line);border-radius:20px;padding:0;margin:0 16px 14px;background:var(--card);
  box-shadow:var(--shadow);overflow:hidden}
details>summary{padding:17px 18px;font-family:var(--serif);font-weight:600;font-size:15px;letter-spacing:.06em;
  cursor:pointer;list-style:none;min-height:52px;display:flex;align-items:center;justify-content:space-between}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"▾";color:var(--accent);font-size:13px}
details[open]>summary::after{content:"▴"}
details .in{padding:0 18px 18px}
.kv{display:grid;grid-template-columns:88px 1fr;gap:9px 12px;font-size:14px}
.kv dt{color:var(--sub);font-size:12.5px;font-weight:600;letter-spacing:.04em}
.kv dd{margin:0}
.note{background:var(--chip);border-radius:14px;padding:13px 15px;font-size:12.5px;color:var(--sub);line-height:1.8}
.range{width:100%;height:44px;accent-color:var(--accent)}
input[type=text],input[type=number],input[type=date],textarea,select{
  width:100%;background:var(--chip);border:1px solid var(--line);border-radius:14px;padding:13px;min-height:50px}
input:focus,textarea:focus,select:focus{outline:2px solid color-mix(in srgb, var(--accent) 55%, transparent);
  outline-offset:1px}
textarea{min-height:80px;resize:vertical}
.hr{height:1px;background:var(--line);margin:20px 16px}

/* ===== 産地 / お店 の切り替え ===== */
.modeswitch{display:flex;background:var(--chip);border-radius:999px;padding:4px;gap:4px}
.modeswitch button{flex:1;min-height:44px;border-radius:999px;font-size:13.5px;font-weight:700;
  color:var(--sub);letter-spacing:.04em;display:flex;align-items:center;justify-content:center;gap:6px}
.modeswitch button svg{width:17px;height:17px}
.modeswitch button[aria-pressed="true"]{background:var(--card);color:var(--accent);box-shadow:var(--shadow)}

/* ===== 商品カード（パッケージ付き） ===== */
.prod{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:0 16px 12px;
  box-shadow:var(--shadow);display:grid;grid-template-columns:66px 1fr;gap:15px;position:relative;overflow:hidden}
.prod:active{box-shadow:var(--shadow-lift);transform:scale(.995)}
.pkg{width:66px;height:auto;align-self:start;
  filter:drop-shadow(0 5px 12px rgba(94,62,44,.24))}
.prod .shopname{font-size:11px;font-weight:800;letter-spacing:.09em;color:var(--accent)}
.prod h3{font-family:var(--serif);font-size:16.5px;font-weight:600;letter-spacing:.03em;margin:4px 0 0;line-height:1.45}
.prod .meta{font-size:12px;color:var(--sub);margin:5px 0 10px}
.prod .foot{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-top:12px}
.prod .per{font-size:10.5px;color:var(--mute);font-weight:600;display:block;letter-spacing:.02em}
.shopcard{display:flex;align-items:center;gap:13px;padding:15px 16px;background:var(--card);
  border:1px solid var(--line);border-radius:18px;margin:0 16px 10px;box-shadow:var(--shadow);width:calc(100% - 32px)}
.shopcard .dot2{width:38px;height:38px;border-radius:13px;flex:none;
  display:grid;place-items:center;color:#fff;font-family:var(--serif);font-size:15px;font-weight:600}
.shopcard .nm{flex:1;text-align:left}
.shopcard .nm b{font-family:var(--serif);font-size:15.5px;font-weight:600;letter-spacing:.04em;display:block}
.shopcard .nm span{font-size:11.5px;color:var(--mute)}
.shopcard .ct{font-size:12px;color:var(--mute);font-weight:700}

/* ===== 自分で撮った写真 ===== */
.photobox{position:relative;width:66px;align-self:start}
.photo{width:66px;height:88px;object-fit:cover;border-radius:11px;display:block;
  box-shadow:0 5px 13px rgba(94,62,44,.26);background:var(--chip)}
.phero .photo,.photo.big{width:96px;height:128px;border-radius:15px}
.phero .photobox{width:96px;flex:none;z-index:1}
.photobox .cam{position:absolute;right:-7px;bottom:-7px;width:32px;height:32px;border-radius:50%;
  background:var(--chipOn);color:var(--chipOnText);display:grid;place-items:center;
  box-shadow:0 3px 10px rgba(94,62,44,.34);border:2px solid var(--card)}
.photobox .cam svg{width:15px;height:15px}
.mybadge{display:inline-flex;align-items:center;font-size:10px;font-weight:800;letter-spacing:.08em;
  padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}

/* ===== 味を5つのまるで入れる ===== */
.dots{display:grid;grid-template-columns:48px 1fr 52px;align-items:center;gap:10px;margin-bottom:8px}
.dots .lb{font-size:12.5px;color:var(--sub);font-weight:700;letter-spacing:.05em}
.dots .wd{font-size:11.5px;color:var(--mute);text-align:right;font-weight:600}
.dots .dd{display:flex;gap:7px}
.dots .dd button{width:40px;height:40px;border-radius:50%;background:var(--track);
  border:2px solid transparent;padding:0;flex:none}
.dots .dd button.on{background:var(--accent);border-color:var(--accent)}
.fab{position:fixed;right:16px;bottom:calc(80px + env(safe-area-inset-bottom));z-index:34;
  width:auto;padding:0 20px;height:54px;border-radius:27px;background:var(--chipOn);color:var(--chipOnText);
  display:none;align-items:center;gap:8px;font-weight:700;font-size:14.5px;letter-spacing:.03em;
  box-shadow:0 6px 22px color-mix(in srgb, var(--accent) 42%, transparent)}
.fab svg{width:19px;height:19px}
body[data-view="search"] .fab{display:flex}
body[data-view="search"] #tray.on ~ .fab{bottom:calc(140px + env(safe-area-inset-bottom))}
.hr{height:1px;background:var(--line);margin:16px 14px}
.sec-title{font-size:13px;font-weight:800;color:var(--mute);letter-spacing:.06em;padding:16px 14px 8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

/* 古い保存データを読んでも壊れないように、足りない項目を補ってから使う */
function migrate(d){
  d=Object.assign(DEF(),d||{});
  d.grinder=Object.assign(DEF().grinder,d.grinder||{});
  d.machine=Object.assign(DEF().machine,d.machine||{});
  d.filter=Object.assign(DEF().filter,d.filter||{});
  if(!Array.isArray(d.myBeans))d.myBeans=[];
  if(!d.photos||typeof d.photos!=='object')d.photos={};
  d.schemaVersion=2;
  return d;
}

function passMood(b){return S.filter.mood.every(m=>{const M=MOODS.find(x=>x.id===m);return M?M.fn(b):true})}
function matchAll(b,q){
  const f=S.filter;
  if(!passMood(b))return false;
  if(f.roast.length&&!f.roast.includes(grp(b.roast)))return false;
  if(f.area.length&&!f.area.includes(b.area))return false;
  if(b.pmin>f.pmax)return false;
  if(q){const s=[b.name,b.sub,b.country,b.region,b.variety,b.say,...b.notes,...b.good].join(' ');
    if(!s.toLowerCase().includes(q.toLowerCase()))return false;}
  return true;
}
function prefScore(b){
  const p=S.pref; if(!p)return 5-b.beg;
  const rg=grp(b.roast)==='浅'?1:grp(b.roast)==='中'?2:3;
  return Math.abs(b.t[0]-p.a)*1.4+Math.abs(b.t[2]-p.body)*1.0+Math.abs(rg-p.roast)*0.8;
}
function sortList(a){
  const s=S.sort;
  if(s==='cheap')return a.sort((x,y)=>x.pmin-y.pmin);
  if(s==='acid') return a.sort((x,y)=>y.t[0]-x.t[0]||x.pmin-y.pmin);
  if(s==='body') return a.sort((x,y)=>y.t[2]-x.t[2]||x.pmin-y.pmin);
  return a.sort((x,y)=>prefScore(x)-prefScore(y)||y.beg-x.beg);
}
const query=()=>($('#q')&&$('#q').value||'').trim();
function filtered(){return sortList(BEANS.filter(b=>matchAll(b,query())))}

/* 0件のときに「どれを外せば見つかるか」を返す。行き止まりを作らないため。 */
function relaxSuggest(){
  const q=query(), f=S.filter, tries=[];
  if(f.pmax<8000)tries.push(['値段の条件をゆるめる',()=>{S.filter.pmax=8000}]);
  if(f.mood.length)tries.push(['「'+MOODS.find(x=>x.id===f.mood[f.mood.length-1]).label+'」を外す',()=>{S.filter.mood.pop()}]);
  if(f.roast.length)tries.push(['焙煎の条件を外す',()=>{S.filter.roast=[]}]);
  if(f.area.length)tries.push(['産地の条件を外す',()=>{S.filter.area=[]}]);
  for(const[label,apply]of tries){
    const bk=JSON.parse(JSON.stringify(S.filter));apply();
    const n=BEANS.filter(b=>matchAll(b,q)).length;const ok=n>0;
    S.filter=bk;
    if(ok)return{label,apply,n};
  }
  return null;
}

/* パッケージの絵。商品写真は権利上使えないので、袋の形と色だけで再現している。
   ロゴや商標は一切描かない。色はブランドの基調色を PRODUCTS の pkg に持たせてある。 */
function shade(hex,d){
  const n=parseInt(hex.slice(1),16);
  const f=v=>Math.max(0,Math.min(255,v+d));
  return '#'+[f(n>>16),f((n>>8)&255),f(n&255)].map(v=>v.toString(16).padStart(2,'0')).join('');
}
function pkgSvg(p,size){
  const big=size==='big', mini=size==='mini';
  const a=(p.pkg&&p.pkg[0])||'#8a6a55', b=(p.pkg&&p.pkg[1])||'#e0cdb5', gid='pg'+p.id+(size||'');
  return '<svg class="pkg'+(mini?' mi':'')+'"'+(big?' style="width:96px"':'')+' viewBox="0 0 64 90" aria-hidden="true">'+
    '<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="1" y2="1">'+
      '<stop offset="0" stop-color="'+shade(a,16)+'"/><stop offset="1" stop-color="'+shade(a,-24)+'"/></linearGradient></defs>'+
    '<rect x="7" y="13" width="50" height="73" rx="5" fill="url(#'+gid+')"/>'+
    '<rect x="4.5" y="4" width="55" height="11" rx="3.5" fill="'+shade(b,-6)+'"/>'+
    '<rect x="9" y="7" width="46" height="2.4" rx="1.2" fill="#fff" opacity=".33"/>'+
    '<rect x="7" y="47" width="50" height="15" fill="'+b+'" opacity=".92"/>'+
    '<circle cx="32" cy="33" r="4.6" fill="#fff" opacity=".34"/>'+
    '<rect x="15" y="68" width="23" height="3" rx="1.5" fill="#fff" opacity=".42"/>'+
    '<rect x="15" y="75" width="15" height="3" rx="1.5" fill="#fff" opacity=".26"/>'+
    '<rect x="7" y="13" width="9" height="73" fill="#fff" opacity=".07"/></svg>';
}

function prodFiltered(){
  const q=query(),f=S.filter;
  const a=allProducts().filter(p=>{
    if(f.shop.length&&!f.shop.includes(p.shop||'（お店なし）'))return false;
    if(f.roast.length&&!f.roast.includes(grp(p.roast)))return false;
    if(p.per100>f.pmax)return false;
    if(f.mood.length){const ab=asBean(p);if(!f.mood.every(m=>{const M=MOODS.find(x=>x.id===m);return M?M.fn(ab):true}))return false}
    if(q){const s=[p.shop,p.name,p.origin,p.roastName,...(p.notes||[]),...(p.good||[])].join(' ');
      if(!s.toLowerCase().includes(q.toLowerCase()))return false}
    return true;
  });
  const s=S.sort;
  if(s==='cheap')return a.sort((x,y)=>x.per100-y.per100);
  if(s==='acid') return a.sort((x,y)=>y.t[0]-x.t[0]||x.per100-y.per100);
  if(s==='body') return a.sort((x,y)=>y.t[2]-x.t[2]||x.per100-y.per100);
  if(S.pref)return a.sort((x,y)=>prefScore(asBean(x))-prefScore(asBean(y)));
  return a.sort((x,y)=>x.shop.localeCompare(y.shop,'ja')||x.per100-y.per100);
}
function shopCounts(){

function renderTray(){

    '<span class="slot"><span class="key" style="background:'+SERIES[i]+'">'+KEYS[i]+'</span>'+
    esc(b.name.slice(0,9))+'<button data-act="cmp" data-id="'+id+'" aria-label="外す" style="padding:0 4px">✕</button></span>':''}).join('');

/* 商品の詳細。パッケージの色からヒーローの背景を作り、明るい色なら文字色を反転する。 */
function lum(hex){const n=parseInt(hex.slice(1),16);
  return (0.2126*(n>>16)+0.7152*((n>>8)&255)+0.0722*(n&255))/255}
function nearestBeans(p,n){
  return BEANS.map(b=>({b,d:b.t.reduce((s,v,i)=>s+Math.abs(v-p.t[i]),0)+Math.abs(b.roast-p.roast)*0.9}))
    .sort((x,y)=>x.d-y.d).slice(0,n).map(x=>x.b);
}

/* 「さがす」でどちらを見ているかに合わせて、産地の豆かお店の商品かを切り替える */
function mapTargets(){return S.mode==='shop'?prodFiltered():filtered()}
const isProd=x=>!!x.pkg;

function miniBean(b){
  const c=b.roast<=3?'var(--roast-l)':b.roast<=5?'var(--roast-m)':'var(--roast-d)';
  return '<svg class="mi" viewBox="0 0 40 54" aria-hidden="true">'+
    '<ellipse cx="20" cy="27" rx="13.5" ry="20" fill="'+c+'"/>'+
    '<path d="M13.5 42C16.5 34 24 20 27 12" stroke="rgba(255,255,255,.55)" stroke-width="2.4" '+
    'fill="none" stroke-linecap="round"/></svg>';
}
function mapIcon(x){
  if(!isProd(x))return miniBean(x);
  const ph=photoOf(x.id);
  return ph?'<img class="mi" src="'+ph+'" alt="">':pkgSvg(x,'mini');
}
/* セルに1つだけ添える手がかり。多いと文字だらけになるので、上から1つ選んで終わり。 */
function mapTag(x){
  const good=(x.good||[]).join(' ');
  if(x.decaf)return '<span class="tag">カフェインレス</span>';
  if(x.beg>=5)return '<span class="tag">はじめてに</span>';
  if(/アイス|水出し/.test(good+(x.brew||[]).join(' ')))return '<span class="tag">アイスに</span>';
  if(/ラテ|カフェオレ|ミルク/.test(good))return '<span class="tag">ミルクに</span>';
  if(/エスプレッソ/.test(good+(x.brew||[]).join(' ')))return '<span class="tag">エスプレッソ</span>';
  return '';
}
function mapCell(x){
  const note=(x.notes||[]).slice(0,2).join('・');
  return '<button class="mapitem" data-act="'+(isProd(x)?'pdetail':'detail')+'" data-id="'+x.id+'">'+
    mapIcon(x)+'<b>'+esc(x.name)+'</b>'+(note?'<em>'+esc(note)+'</em>':'')+mapTag(x)+'</button>';
}
function renderGridMap(){
  const items=mapTargets();
  const cols={'浅':[],'中':[],'深':[]};
  items.forEach(x=>{const g=grp(x.roast);if(cols[g])cols[g].push(x)});
  /* 縦は上が「すっきり」、下へ行くほど「しっかり」。コクが同じなら苦味の弱い順。 */
  Object.keys(cols).forEach(k=>cols[k].sort((a,b)=>a.t[2]-b.t[2]||a.t[1]-b.t[1]||b.t[0]-a.t[0]));
  const col=k=>'<div class="col">'+(cols[k].length?cols[k].map(mapCell).join(''):
    '<div class="colempty">この あたりの豆は<br>いま出ていません</div>')+'</div>';
  $('#mapbody').innerHTML='<div class="cmap">'+
    '<div class="corner"></div><div class="zh z-l">軽やか</div>'+
    '<div class="zh z-m">ほどよい</div><div class="zh z-d">深み</div>'+
    '<div class="yaxis"><span>すっきり</span><span>しっかり</span></div>'+
    col('浅')+col('中')+col('深')+'</div>'+
    '<div class="barista"><span class="bico">☕</span><p>横に進むほど深く焼かれていて、'+
    '苦味とコクが増え、酸味は減ります。縦は下へ行くほど口に残る重さが出ます。'+
    '<b>気に入った豆の場所を覚えておくと、次はその近くを選べば外れません。</b>'+
    'ひとつ隣に動かすくらいが、冒険しすぎずに好みを広げるコツです。</p></div>';
  $('#maphint').textContent='いま '+items.length+'件を表示中'+
    (S.mode==='shop'?'（お店の商品）':'（産地の代表例）')+'。「さがす」の絞り込みがそのまま効いています。';
}
function renderScatter(){
  const W=340,H=280,L=40,R=14,T=16,B=38;
  const px=r=>L+(r-1)/7*(W-L-R), py=v=>H-B-(v-1)/4*(H-T-B);
  let g='';
  for(let v=1;v<=5;v++){g+='<line x1="'+L+'" y1="'+py(v)+'" x2="'+(W-R)+'" y2="'+py(v)+'" stroke="var(--line)" stroke-width="1"/>'+
    '<text x="'+(L-7)+'" y="'+(py(v)+4)+'" font-size="10" fill="var(--mute)" text-anchor="end">'+v+'</text>'}
  [[1,'浅'],[4,'中'],[7,'深']].forEach(function(z){
    g+='<text x="'+px(z[0])+'" y="'+(H-B+16)+'" font-size="11" fill="var(--mute)" text-anchor="middle">'+z[1]+'煎り</text>'});
  const shown=mapTargets();
  shown.forEach((b,i)=>{
    const seed=(parseInt(String(b.id).replace(/\D/g,''),10)||i)+i;
    const jx=((seed*37)%9-4)*1.6, jy=((seed*17)%7-3)*1.6;
    const fav=S.fav.includes(b.id);
    g+='<circle class="dot" data-act="'+(isProd(b)?'pdetail':'detail')+'" data-id="'+b.id+'" cx="'+(px(b.roast)+jx)+
      '" cy="'+(py(b.t[mapY])+jy)+'" r="'+(fav?9.5:7)+'" fill="'+(fav?'var(--s1)':'var(--s2)')+
      '" fill-opacity="'+(fav?1:.72)+'" stroke="var(--card)" stroke-width="2.2"><title>'+esc(b.name)+'</title></circle>';
  });
  g+='<text x="'+(W-R)+'" y="'+(T+2)+'" font-size="10" fill="var(--mute)" text-anchor="end">たて＝'+
     MAPAX.find(a=>a[0]===mapY)[1]+'　よこ＝焙煎</text>';
  $('#mapbody').innerHTML='<div class="mapwrap"><svg viewBox="0 0 '+W+' '+H+
    '" role="img" aria-label="豆の味の分布図">'+g+'</svg></div>';
  $('#maphint').innerHTML='いま '+shown.length+'件を表示中。'+(S.fav.length?'大きい赤茶の点はお気に入りです。':'');
}

/* =========================================================================
   エスプレッソ（ダイヤルイン記録）
   ========================================================================= */
const TARGET={'浅':{rmin:2.0,rmax:2.6,tmin:28,tmax:36},'中':{rmin:1.8,rmax:2.2,tmin:25,tmax:32},'深':{rmin:1.4,rmax:1.9,tmin:20,tmax:27}};
const G=()=>S.grinder, M=()=>S.machine;
/* エスプレッソに実際に使う目盛りの範囲。ソリス スカラプラスは21段階あるが、
   極細挽きは1〜4しかない。全体の範囲で刻みを決めると、範囲外の提案が出てしまう。 */
const espLo=()=>Math.min(G().espMin,G().espMax);
const espHi=()=>Math.max(G().espMin,G().espMax);
const clampEsp=v=>Math.min(espHi(),Math.max(espLo(),+(+v).toFixed(2)));
const dirFine=()=>G().finer==='down'?-1:1;
const finer=(v,n)=>clampEsp(v+dirFine()*n*G().step);
const coarser=(v,n)=>clampEsp(v-dirFine()*n*G().step);
const espSteps=()=>Math.max(1,Math.round((espHi()-espLo())/G().step));
const bigStep=()=>Math.max(1,Math.round(espSteps()*0.25));
const atFinest=v=>G().finer==='down'?v<=espLo()+1e-9:v>=espHi()-1e-9;
const atCoarsest=v=>G().finer==='down'?v>=espHi()-1e-9:v<=espLo()+1e-9;

/* 挽き目を動かしたいが、使える範囲の端まで来ていることがある。
   そこで「もっと細かく」と言い続けても実行できないので、粉の量に切り替える。
   粉を増やせば抵抗が増えて時間が伸び、減らせば縮む。挽き目と同じ効果が得られる。 */
function grindOr(sh,fine,n,why,prep){
  const u=G().unit, R=(k,d,t,nx)=>({k,why,doIt:d,tip:t,next:nx||null});
  if(fine&&!atFinest(sh.grindValue))
    return R('挽き目','挽き目を '+(n*G().step)+u+' ぶん細かく（'+sh.grindValue+' → '+finer(sh.grindValue,n)+'）',
      '細かくすると湯が通りにくくなり、時間が伸びて成分が多く溶け出します。',{grindValue:finer(sh.grindValue,n)});
  if(!fine&&!atCoarsest(sh.grindValue))
    return R('挽き目','挽き目を '+(n*G().step)+u+' ぶん粗く（'+sh.grindValue+' → '+coarser(sh.grindValue,n)+'）',
      '粗くすると湯が早く抜け、出しすぎを抑えられます。',{grindValue:coarser(sh.grindValue,n)});
  const nd=+(sh.doseG+(fine?0.5:-0.5)).toFixed(1);
  return R('粉の量','粉を '+nd+'g に'+(fine?'増やす':'減らす'),
    '挽き目はもう'+(fine?'いちばん細かい（'+espLo()+u+'）':'いちばん粗い（'+espHi()+u+'）')+'ところなので、粉の量で抵抗を変えます。'+
    (fine?'粉を増やすと湯が通りにくくなり、時間が伸びます。':'粉を減らすと湯が通りやすくなり、時間が縮みます。'),
    {doseG:nd});
}

/* 一度に変えるのは1つだけ。だから提案も必ず1つに絞る。
   物理的な異常 → 抽出時間 → 味 の順に見る。時間が目標から外れているうちは、
   味の議論をしても意味がないため。 */
function advise(sh){
  const b=anyById(sh.beanId), g=grp(b?b.roast:5), T=TARGET[g], m=M();
  const ratio=sh.yieldG/sh.doseG, flow=sh.yieldG/sh.timeSec, big=bigStep();
  const fill=m.capacityG?sh.doseG/m.capacityG:1;
  const R=(k,why,doIt,tip,next)=>({k,why,doIt,tip,next:next||null});
  const PREP='細い針で粉を全体にほぐし（WDT）、表面を平らにしてから、まっすぐ水平に押し固めてください。'+
    (m.bottomless?'ボトムレスなので、抽出中に横へ飛び散らないかを見れば、うまくいったか一目で分かります。':'')+
    '一定圧のタンパーを使っているなら、押す力ではなく「ほぐし」と「水平」が原因です。';

  /* レイヤー0：物理的な異常。味を聞く前に止める */
  if(fill>1.15)return R('粉の量','バスケット（'+m.basketMm+'mm・約'+m.capacityG+'g）に対して粉が多すぎます',
    '粉を '+(sh.doseG-1).toFixed(1)+'g に減らす',
    '粉が多すぎると、乾いた粉が上の部品に触れて、必ず湯の通り道ができます。',{doseG:+(sh.doseG-1).toFixed(1)});
  if(fill<0.65)return R('粉の量','バスケットに対して粉が少なすぎます',
    '粉を '+m.capacityG.toFixed(1)+'g まで増やす','粉が少ないと湯が素通りして、薄く水っぽくなります。',{doseG:+m.capacityG});
  if(sh.spray)return R('粉の準備','抽出中に横へ飛び散った＝湯の通り道ができています',
    '挽き目は変えず、粉のほぐし方を直す',PREP+'ここで挽き目をいじると、かえって悪くなります。');
  if(flow>2.5||sh.timeSec<12)
    return grindOr(sh,true,big,'湯が一気に抜けています（'+flow.toFixed(1)+'g/秒）',PREP);
  if(sh.timeSec>50&&ratio<1.0)
    return grindOr(sh,false,big,'詰まってほとんど落ちていません',PREP);

  /* レイヤー1：抽出時間を目標帯に入れる */
  const tw='（'+sh.timeSec+'秒／目標 '+T.tmin+'〜'+T.tmax+'秒）';
  if(sh.timeSec<T.tmin-4)return grindOr(sh,true,Math.min(2,big+1),'抽出が速すぎます'+tw,PREP);
  if(sh.timeSec<T.tmin)   return grindOr(sh,true,1,'少し速めです'+tw,PREP);
  if(sh.timeSec>T.tmax+4) return grindOr(sh,false,Math.min(2,big+1),'抽出が遅すぎます'+tw,PREP);
  if(sh.timeSec>T.tmax)   return grindOr(sh,false,1,'少し遅めです'+tw,PREP);

  /* レイヤー2：時間は合っている。ここから味で判断する */
  if(sh.bal>=1&&sh.str<=-1)
    return R('粉の準備','「苦いのに薄い」は、出しすぎと出し足りないが同時に起きているサインです',
      '挽き目は変えず、粉のほぐし方を直す',PREP);
  if(sh.bal<=-1){
    if(ratio<T.rmax-0.2)return R('抽出量','酸っぱい＝まだ成分が出きっていません',
      '抽出量を '+Math.round(sh.doseG*(ratio+0.2))+'g まで伸ばす','同じ粉からもう少し引き出します。',
      {yieldG:+(sh.doseG*(ratio+0.2)).toFixed(1)});
    return grindOr(sh,true,1,'酸っぱい＝まだ成分が出きっていません',PREP);
  }
  if(sh.bal>=1){
    if(ratio>T.rmin+0.2)return R('抽出量','苦い＝出しすぎです',
      '抽出量を '+Math.round(sh.doseG*(ratio-0.2))+'g で止める','雑味が出る前に切ります。',
      {yieldG:+(sh.doseG*(ratio-0.2)).toFixed(1)});
    return grindOr(sh,false,1,'苦い＝出しすぎです',PREP);
  }
  if(sh.str<=-1)return R('抽出量','味の方向は良いですが薄いです',
    '抽出量を '+Math.round(sh.doseG*(ratio-0.3))+'g に減らす',
    'バランスは崩さず濃さだけ上げます。アイスラテにするなら、ここは短めに切るのが正解です。',
    {yieldG:+(sh.doseG*(ratio-0.3)).toFixed(1)});
  if(sh.str>=1)return R('抽出量','味の方向は良いですが濃すぎます',
    '抽出量を '+Math.round(sh.doseG*(ratio+0.3))+'g まで伸ばす','薄めます。',
    {yieldG:+(sh.doseG*(ratio+0.3)).toFixed(1)});
  return R('完成','目標どおりのショットです（1:'+ratio.toFixed(1)+'／'+sh.timeSec+'秒）',
    'この設定を、この豆のベストとして覚えておく',
    '次に同じ豆を買ったとき、ここから始めればダイヤルインは一発で終わります。');
}
/* 同じ手を3回打って★が伸びていないなら、別の変数に切り替えるよう促す */
function stuck(){
  const d=S.shots.filter(s=>s.status==='done').slice(-3);
  if(d.length<3)return false;
  return d.every(s=>s.adv&&s.adv.k==='挽き目')&&d[2].rating<=d[0].rating;
}
function lastDone(){return [...S.shots].reverse().find(s=>s.status==='done')}
function draft(){return S.shots.find(s=>s.status==='draft')}

function renderEsp(){
  const d=draft();
  $('#esp-draft').innerHTML=d?
    '<div class="card" style="border-color:var(--warn)"><strong style="font-size:14px">☕ 味の評価まち</strong>'+
    '<p class="muted" style="margin:4px 0 10px">'+esc((anyById(d.beanId)||{name:'豆'}).name)+'　'+
    d.doseG+'g → '+d.yieldG+'g／'+d.timeSec+'秒</p>'+
    '<button class="btn wide" data-act="taste" data-id="'+d.id+'">飲んだ感想を入れる</button></div>':'';

  const L=lastDone();
  if(L&&L.adv){
    const a=L.adv;
    $('#esp-advice').innerHTML='<div class="advice'+(a.k==='完成'?' ok':'')+'">'+
      '<div class="k">つぎの一手 ／ '+esc(a.k)+'</div>'+
      '<div class="muted" style="font-size:13px">'+esc(a.why)+'</div>'+
      '<div class="do">'+esc(a.doIt)+'</div>'+
      '<p class="tiny">'+esc(a.tip)+'</p>'+
      (stuck()?'<div class="note" style="margin-top:10px">挽き目を3回続けて調整しても良くなっていません。挽き目ではなく、抽出量か粉の量を変えてみてください。豆が焙煎直後で若すぎる可能性もあります。</div>':'')+
      (a.next?'<button class="btn wide" style="margin-top:12px" data-act="applyadv">この通りに設定して記録する</button>':
        '<button class="btn ghost wide" style="margin-top:12px" data-act="newshot">同じ設定でもう一杯</button>')+
      '</div>';
  }else $('#esp-advice').innerHTML='';

  const best={};
  S.shots.filter(s=>s.status==='done'&&s.rating>=4).forEach(s=>{
    if(!best[s.beanId]||s.rating>=best[s.beanId].rating)best[s.beanId]=s});
  const bs=Object.values(best);
  $('#esp-best').innerHTML=bs.length?'<div class="sec-title">うまくいったレシピ</div>'+bs.map(s=>{
    const b=anyById(s.beanId);return '<div class="card"><div class="between"><strong>'+
    esc(b?b.name:'—')+'</strong><span style="color:var(--gold)">'+'★'.repeat(s.rating)+'</span></div>'+
    '<p class="muted" style="margin:6px 0 10px">粉 '+s.doseG+'g → '+s.yieldG+'g（1:'+(s.yieldG/s.doseG).toFixed(1)+
    '）／'+s.timeSec+'秒／挽き目 '+s.grindValue+G().unit+'</p>'+
    '<button class="btn ghost wide" data-act="reuse" data-id="'+s.id+'">このレシピで淹れる</button></div>'}).join(''):'';

  const done=S.shots.filter(s=>s.status==='done').slice(-10);
  $('#esp-history').innerHTML=done.length?'<div class="card">'+done.map(s=>{
    const col=s.bal<0?'var(--s2)':s.bal>0?'var(--s1)':'var(--ok)';
    const w=Math.min(100,s.timeSec/45*100);
    return '<div class="shotrow"><span class="tiny">'+new Date(s.at).toLocaleDateString('ja-JP',{month:'numeric',day:'numeric'})+'</span>'+
      '<span class="bar"><i style="width:'+w+'%;background:'+col+'"></i></span>'+
      '<span class="tiny" style="text-align:right">'+s.timeSec+'秒</span>'+
      '<span class="tiny" style="text-align:right">'+(s.rating?'★'+s.rating:'—')+'</span></div>'}).join('')+
    '<p class="tiny" style="margin-top:12px">棒の長さ＝抽出時間。<span style="color:var(--s2);font-weight:700">青緑</span>＝酸っぱい／'+
    '<span style="color:var(--ok);font-weight:700">緑</span>＝ちょうど／<span style="color:var(--s1);font-weight:700">赤茶</span>＝苦い。'+
    '緑がそろってきたら、その豆のダイヤルインは完了です。</p></div>':
    '<div class="empty" style="padding:24px"><span class="g">☕</span>まだ記録がありません。<br>1杯目を記録すると、次にどう調整すればいいかを提案します。'+
    '<p class="tiny" style="margin-top:16px;text-align:left">いまの設定<br>'+
    '・'+esc(M().name)+'（'+M().basketMm+'mm・約'+M().capacityG+'g'+(M().bottomless?'・ボトムレス':'')+'）<br>'+
    '・'+esc(G().name)+'（エスプレッソに使う範囲 '+espLo()+'〜'+espHi()+esc(G().unit)+'）</p></div>';
}

/* 記録フォーム */
let form={};
function shotSheet(pre){
  const g=G(), m=M(), last=[...S.shots].reverse()[0];
  form=Object.assign({beanId:(BEANS.find(b=>b.brew.includes('エスプレッソ'))||BEANS[0]).id,
    doseG:m.capacityG,yieldG:+(m.capacityG*2).toFixed(1),timeSec:28,
    grindValue:+((espLo()+espHi())/2).toFixed(1)},
    last?{beanId:last.beanId,doseG:last.doseG,yieldG:last.yieldG,timeSec:last.timeSec,grindValue:last.grindValue}:{},pre||{});
  const step=(k,label,unit,dec)=>'<div class="field"><label>'+label+'</label><div class="step">'+
    '<button data-act="st" data-k="'+k+'" data-d="-1">−</button>'+
    '<span class="val" id="f-'+k+'">'+form[k].toFixed(dec)+'<small>'+unit+'</small></span>'+
    '<button data-act="st" data-k="'+k+'" data-d="1">＋</button></div></div>';
  const body='<div class="pad">'+
    '<div class="field"><label>豆</label><select id="f-bean">'+
      ((S.myBeans||[]).length?'<optgroup label="自分で登録した豆">'+S.myBeans.map(p=>'<option value="'+p.id+'"'+
        (p.id===form.beanId?' selected':'')+'>'+esc((p.shop?p.shop+' ':'')+p.name)+'</option>').join('')+'</optgroup>':'')+
      '<optgroup label="お店の商品">'+PRODUCTS.map(p=>'<option value="'+p.id+'"'+
        (p.id===form.beanId?' selected':'')+'>'+esc(p.shop+' '+p.name)+'</option>').join('')+'</optgroup>'+
      '<optgroup label="産地から">'+BEANS.map(b=>'<option value="'+b.id+'"'+
        (b.id===form.beanId?' selected':'')+'>'+esc(b.name)+'</option>').join('')+'</optgroup></select></div>'+
    step('doseG','粉の量（ドーズ）','g',1)+
    step('yieldG','出来上がりの量','g',1)+
    step('timeSec','抽出時間','秒',0)+
    '<div class="field"><label>抽出時間をすばやく</label><div class="chips">'+
      [20,24,26,28,30,32,36].map(v=>'<button class="chip" data-act="setsec" data-v="'+v+'">'+v+'秒</button>').join('')+'</div></div>'+
    step('grindValue','挽き目','',1)+
    '<div class="note">'+esc(m.name)+'（'+m.basketMm+'mm・約'+m.capacityG+'g）／'+esc(g.name)+
    '：エスプレッソに使うのは '+espLo()+'〜'+espHi()+esc(g.unit)+'、数字が'+(g.finer==='down'?'小さい':'大きい')+
    'ほど細かい設定です。違う場合は「機器の設定」で直してください。</div>'+
    '<div class="note" style="margin-top:10px" id="f-calc"></div></div>';
  openSheet('抽出を記録する',body,
    '<button class="btn ghost" data-close style="flex:1">やめる</button><button class="btn" data-act="saveshot" style="flex:2">保存する</button>',
    ()=>{$('#f-bean').onchange=e=>{form.beanId=e.target.value;calc()};calc()});
}
function calc(){
  const r=form.yieldG/form.doseG, f=form.yieldG/form.timeSec, fill=form.doseG/M().capacityG;
  let warn='';

function readGear(){

  const raw=id=>{const e=$('#'+id);return e&&typeof e.value==='string'?e.value:null};
  const num=(id,def)=>{const x=raw(id);return x===null||x===''||isNaN(+x)?def:+x};
  const str=(id,def)=>{const x=raw(id);return x===null?def:(x.trim()||def)};
  g.name=str('g-name',g.name);
  g.min=num('g-min',g.min); g.max=num('g-max',g.max);
  g.espMin=num('g-emin',g.espMin); g.espMax=num('g-emax',g.espMax);
  g.step=Math.max(0.05,num('g-step',g.step)||1);
  if(g.max<=g.min)g.max=g.min+10;

/* =========================================================================
   写真 ―― 撮った写真は縮めてから端末の中だけに保存する。外へは一切送らない。
   localStorage は数MBで頭打ちなので、長辺520px・JPEG品質0.72まで落としている
   （1枚おおよそ30〜60KB）。保存に失敗したら元に戻して、理由を伝える。
   ========================================================================= */
let shootTarget=null;
function compressImage(file,maxW,q){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>{const img=new Image();
      img.onload=()=>{
        const sc=Math.min(1,maxW/(img.width||maxW));
        const c=document.createElement('canvas');
        c.width=Math.max(1,Math.round((img.width||maxW)*sc));
        c.height=Math.max(1,Math.round((img.height||maxW)*sc));
        const x=c.getContext('2d');
        x.fillStyle='#ffffff';x.fillRect(0,0,c.width,c.height);
        x.drawImage(img,0,0,c.width,c.height);
        try{res(c.toDataURL('image/jpeg',q))}catch(err){rej(err)}
      };
      img.onerror=()=>rej(new Error('画像を読み込めませんでした'));
      img.src=r.result;};
    r.onerror=()=>rej(new Error('ファイルを読み込めませんでした'));
    r.readAsDataURL(file);
  });
}

document.addEventListener('click',e=>{

  else if(a==='pdetail'){if(e.target.closest('[data-act="fav"]'))return;openProd(id)}

  else if(a==='allshops'){S.filter.shop=[];save();renderList();window.scrollTo(0,0)}

    renderList();if($('#full').classList.contains('on'))openDetail(id);renderMy();renderMap()}
  else if(a==='cmp'){e.stopPropagation();
    if(S.cmp.includes(id))S.cmp=S.cmp.filter(x=>x!==id);
    else if(S.cmp.length>=3){alert('くらべられるのは3件までです。どれかを外してください。');return}
    else S.cmp.push(id);

      (S.cmp.length>=2?openCompare():closeFull());else if($('#full').classList.contains('on'))openDetail(id)}
  else if(a==='mood'||a==='f'){const k=a==='mood'?'mood':t.dataset.k,v=a==='mood'?id:t.dataset.v;
    S.filter[k]=S.filter[k].includes(v)?S.filter[k].filter(x=>x!==v):S.filter[k].concat(v);
    save();renderList();renderMap();refreshSheetCounts()}
  else if(a==='untag'){const k=t.dataset.k;

  else if(a==='relax'){const r=relaxSuggest();if(r){r.apply();save();renderList();renderMap()}}
  else if(a==='sort'){S.sort=t.dataset.v;save();closeSheet();renderList()}

  else if(a==='diag'){diagSheet()}
  else if(a==='qa'){const o=QS[qi].a[+t.dataset.i][1];Object.assign(qacc,o);qi++;nextQ()}
  else if(a==='rate'){const cur=S.log[id]||{},me=$('#logmemo');
    S.log[id]=Object.assign({},cur,{rate:cur.rate===t.dataset.v?'':t.dataset.v,
      memo:me?me.value:(cur.memo||''),at:Date.now()});
    save();openDetail(id);renderMy()}
  else if(a==='savememo'){const m=$('#logmemo').value;
    S.log[id]=Object.assign({rate:''},S.log[id],{memo:m,at:Date.now()});save();renderMy();
    t.textContent='保存しました';setTimeout(()=>{t.textContent='ひとことを保存'},1200)}
  else if(a==='shotwith'){closeFull();setView('esp');shotSheet({beanId:id})}
  else if(a==='newshot'){shotSheet()}

    s.spray=t.dataset.v==='1';save();tasteSheet(s.id)}
  else if(a==='star'){const s=S.shots.find(x=>x.status==='draft');if(!s)return;
    s.rating=+t.dataset.v;save();tasteSheet(s.id)}
  else if(a==='donetaste'){const s=S.shots.find(x=>x.id===id);if(!s)return;

    yieldG:L.yieldG,timeSec:L.timeSec,grindValue:L.grindValue},L.adv.next))}
  else if(a==='reuse'){const s=S.shots.find(x=>x.id===id);if(s)shotSheet({beanId:s.beanId,doseG:s.doseG,
    yieldG:s.yieldG,timeSec:s.timeSec,grindValue:s.grindValue})}
  else if(a==='gr'){grinderSheet()}

  else if(a==='mset'){readGear();S.machine.bottomless=t.dataset.v==='1';save();grinderSheet()}

  else if(a==='mydot'){if(!myForm)return;
    const i=+t.dataset.i,v=+t.dataset.v,row=t.closest('.dots');
    myForm.t[i]=v;

/* ブラウザによってはファイルの保存がそもそもできない（スマホや、公開ページとして
   開いたとき）。そこで文字にして持ち出せる経路を必ず用意しておく。
   写真は文字にすると膨大になるので、こちらには含めない。 */
/* パソコンで直接ファイルを開いているときだけ、ファイルの保存ができる。
   ウェブに公開したページの中ではブラウザが保存を止めるので、文字の控えに一本化する。 */
function canDownload(){
  try{return location.protocol==='file:'}catch(e){return false}
}
function backupSheet(){
  const light=Object.assign({},S,{photos:{}});
  const json=JSON.stringify(light);
  const body='<div class="pad">'+
    '<p class="muted" style="margin:0 0 12px">下の文字をすべてコピーして、メモ帳やメールに貼って保管してください。'+
    '別の端末では、下段に貼り付ければそのまま戻せます。</p>'+
    '<textarea id="bk-text" readonly style="min-height:130px;font-size:11.5px;line-height:1.5">'+esc(json)+'</textarea>'+
    '<button class="btn wide" style="margin-top:10px" data-act="copytext">この文字をコピーする</button>'+
    '<div class="note" style="margin-top:12px">豆の登録・感想・抽出の記録・設定がすべて入っています（'+
    Math.round(json.length/1024)+'KB）。<b>写真だけは文字にできないので入っていません。</b>'+
    '写真ごと残したいときは、パソコンで「ファイルに書き出す」を使ってください。</div>'+
    '<div class="hr" style="margin:22px 0"></div>'+
    '<label style="display:block;font-size:12.5px;font-weight:700;color:var(--sub);margin-bottom:9px;'+
    'letter-spacing:.06em">保管しておいた文字から戻す</label>'+
    '<textarea id="bk-in" placeholder="ここに貼り付けてください" style="min-height:100px;font-size:11.5px"></textarea>'+
    '<button class="btn ghost wide" style="margin-top:10px" data-act="pastetext">貼り付けた内容で戻す</button>'+
    '</div>';
  openSheet('記録の控え',body);
}
function copyBackup(btn){
  const el=$('#bk-text');if(!el)return;
  const done=()=>{btn.textContent='コピーしました';S.lastExport=Date.now();save();
    setTimeout(()=>{btn.textContent='この文字をコピーする'},1600)};
  const manual=()=>{
    try{el.focus();el.select();
      if(document.execCommand&&document.execCommand('copy'))return done();
    }catch(e){}
    alert('自動でコピーできませんでした。上の枠を長押しして、すべて選んでコピーしてください。');
  };
  if(navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(el.value).then(done,manual);
  else manual();
}
function pasteBackup(){
  const el=$('#bk-in');const v=el&&el.value?el.value.trim():'';
  if(!v){alert('先に、保管しておいた文字を貼り付けてください。');return}
  let d;
  try{d=JSON.parse(v)}
  catch(e){alert('読み取れませんでした。文字が途中で切れていないか確かめてください。');return}
  if(!d||typeof d!=='object'){alert('この文字は記録の控えではないようです。');return}
  if(!confirm('いまこの端末にある記録は上書きされます。よろしいですか？'))return;
  const keepPhotos=S.photos||{};
  S=migrate(d);
  /* 控えに写真は入っていないので、いま端末にある写真はそのまま残す */
  Object.keys(keepPhotos).forEach(k=>{if(!S.photos[k])S.photos[k]=keepPhotos[k]});
  save();closeSheet();renderAll();alert('記録を戻しました。');
}
function exportJSON(){
  try{
    const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='まめ比べ_backup_'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    S.lastExport=Date.now();save();renderMy();
  }catch(err){alert('書き出しに失敗しました：'+err.message)}
}
document.addEventListener('change',e=>{
  if(e.target.id==='photofile'){
    const f=e.target.files&&e.target.files[0];e.target.value='';
    const id=shootTarget;shootTarget=null;
    if(!f||!id)return;
    compressImage(f,520,0.72).then(d=>{if(setPhoto(id,d))refreshAfterPhoto(id)})
      .catch(err=>alert('写真を取り込めませんでした：'+err.message));
    return;
  }
  if(e.target.id!=='importfile')return;
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{
    const d=JSON.parse(r.result);
    if(!d||typeof d!=='object')throw new Error('形式が違います');
    if(!confirm('読み込むと、いまの記録は上書きされます。よろしいですか？'))return;
    S=migrate(d);save();renderAll();alert('読み込みました。');
  }catch(err){alert('読み込めませんでした：'+err.message)}};
  r.readAsText(f);e.target.value='';
});

  document.querySelectorAll('.tabbar button').forEach(b=>b.setAttribute('aria-selected',b.dataset.go===v));
  $('#apptitle').textContent={search:'まめ比べ',map:'味の地図',esp:'エスプレッソ',my:'わたしの記録'}[v];
  $('#btn-filter').style.display=(v==='search'||v==='map')?'grid':'none';
  if(v==='map')renderMap();if(v==='esp')renderEsp();if(v==='my')renderMy();
  window.scrollTo(0,0);
}

/* ===== 用語集 ===== */
$('#glossary').innerHTML=[
  ['精製方法（せいせい）','コーヒーの実から種（＝豆）を取り出す方法のこと。<b>味に一番効く要素のひとつ</b>で、同じ産地でもこれが違うと別物になります。'],
  ['ウォッシュト','果肉を洗い落としてから乾かす方法。雑味が少なく、酸味がきれいに出ます。'],
  ['ナチュラル','実をつけたまま天日で干す方法。果実の甘い香りが強く出ます。'],
  ['ハニー製法','果肉を少し残して乾かす方法。上のふたつの中間で、甘みが乗ります。蜂蜜は使いません。'],
  ['焙煎度（ばいせんど）','豆をどれだけ深く焼いたか。日本では8段階（ライト／シナモン／ミディアム／ハイ／シティ／フルシティ／フレンチ／イタリアン）で呼びます。<b>深く焼くほど苦味とコクが増え、酸味は減ります。</b>'],
  ['フレーバーノート','「ブルーベリー」「ジャスミン」など、感じられる香りを他の食べ物にたとえた言葉。<b>その材料が入っているわけではありません。</b>'],
  ['シングルオリジン','ひとつの国・地域・農園の豆だけで作られたもの。産地の個性がそのまま出ます。'],
  ['ブレンド','複数の豆を混ぜたもの。味を安定させたり、狙った方向に作り込んだりできます。'],
  ['スペシャルティコーヒー','産地までたどれて、品質評価が高い豆のこと。おおむね100gあたり700円以上の帯になります。'],
  ['ブリューレシオ','エスプレッソで「粉の量：出来上がりの量」の比率。18gの粉から36g出せば1:2です。'],
  ['ダイヤルイン','エスプレッソで、挽き目や量を少しずつ調整して、その豆のちょうどいい設定を探し当てる作業のこと。']
].map(g=>'<div style="margin-bottom:14px"><strong style="font-size:14px">'+g[0]+'</strong>'+
  '<p class="tiny" style="margin-top:3px">'+g[1]+'</p></div>').join('');

/* ===== 起動 ===== */
function renderAll(){renderList();renderMap();renderEsp();renderMy()}
if(S.theme)document.documentElement.setAttribute('data-theme',S.theme);
renderAll();setView('search');
if(!S.pref&&!Object.keys(S.log).length&&!S.shots.length)setTimeout(diagSheet,400);
</script>
